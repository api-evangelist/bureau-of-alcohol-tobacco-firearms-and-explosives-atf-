description: >-
  ATF has no plans and no pricing, and that is the correct finding rather than a
  gap. It is a U.S. federal law-enforcement agency publishing public data under
  17 U.S.C. 105; the API surface is anonymous, free, and has no signup, no key
  issuance, no metering and no billing relationship of any kind. There is no
  enterprise "contact us" tier either — there is nobody to contact about API
  access because access is unconditional.
  THIS FILE REPLACES A FABRICATION. The 2026-05-04 bulk sweep wrote three invented
  tiers here — "Free" at 1,000 requests/month, "Professional" at 100,000/month
  with a "TBD" overage price, and an "Enterprise" tier offering "Custom Data
  Residency", "Contractual SLA" and a "Dedicated Account Manager" — none of which
  ATF has ever offered, alongside elements ("Sandbox Access", "Webhook
  Subscriptions") for capabilities that do not exist. All of it has been removed.
