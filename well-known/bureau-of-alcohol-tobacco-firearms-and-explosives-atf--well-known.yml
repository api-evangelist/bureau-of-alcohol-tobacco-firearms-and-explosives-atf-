  crawler being refused, not evidence about what ATF publishes. eforms.atf.gov is a
  single-page application whose catch-all answers 200 with the same HTML shell for
  every path, which is the dominant /.well-known/ false positive; those rows are
  recorded as misses on content, not on status.
