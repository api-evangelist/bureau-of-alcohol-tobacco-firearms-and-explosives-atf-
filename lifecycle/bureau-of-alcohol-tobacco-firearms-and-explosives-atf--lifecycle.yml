    - part: '771'
      title: Rules of Practice in Explosive License and Permit Proceedings
      versions: 1
      latest: '2019-24570'
      latest_effective: '2019-12-26'
  note: >-
    Version counts and dates above were read from GET /api/regulation/{part} on
    2026-09-05. Note the spread: 27 CFR 478 is current to January 2026 while
    27 CFR 646 has not been reloaded since 2014 — a consumer should not assume
    every part is equally fresh.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  deprecated_operations: []
  detail: >-
    No RFC 8594 Sunset header and no Deprecation header on any response. No
    deprecation policy page exists. Nothing signals in advance that an endpoint
    or a dataset is going away.
sla:
  published: false
  uptime_target: null
  detail: No service-level agreement or availability target is published.
status_page:
  url: null
  detail: >-
    ATF operates no status page. Searched atf.gov and the standard vendors; there
    is no status.atf.gov, no Statuspage/Instatus/Better Stack tenant, and no
    incident feed. Outages are unannounced. The ArcGIS-hosted layers inherit Esri's
    ArcGIS Online status page (https://status.arcgis.com/), which is a THIRD-PARTY
    signal covering the platform, not ATF's data.
change_notification:
  channel: none
  detail: >-
    There is no API changelog and no developer mailing list. The nearest thing is
    a domain-specific feed rather than an engineering one: GET /api/notice returns
    the dated Federal Register notices that amend these parts, with
    document_number, publication_date, effective_on and the federalregister.gov
    URL. That tells a consumer when the REGULATION changed. It says nothing about
    when the API changes.
