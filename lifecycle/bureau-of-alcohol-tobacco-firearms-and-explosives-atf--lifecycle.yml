provider: Bureau of Alcohol, Tobacco, Firearms and Explosives (ATF)
providerId: bureau-of-alcohol-tobacco-firearms-and-explosives-atf-
source: >-
  Live probes on 2026-09-05 plus a search of atf.gov, regulations.atf.gov and the
  atfweb GitHub organization for any versioning, deprecation, SLA or status
  commitment.
summary: >-
  ATF makes no lifecycle commitments about its API surface. There is no published
  versioning policy, no deprecation policy, no Sunset or Deprecation header, no
  SLA and no status page. This is an unusually consequential gap for a regulatory
  data source: consumers of 27 CFR text and of the Federal Firearms Licensee list
  are building compliance workflows on endpoints that carry no stability promise
  and no notification channel if they change.
versioning:
  api_versioning: none
  detail: >-
    No /v1/ path segment, no version header, no media-type versioning on any
    endpoint. What LOOKS like versioning is data versioning: eRegulations
    identifies each state of a CFR part by the Federal Register document number
    that produced it (/api/regulation/478/2026-01141), which is a citation, not an
    interface version. The ArcGIS `currentVersion: 12` is the Esri platform
    release.
  data_versions_available:
    - part: '447'
      title: Importation of Arms, Ammunition and Implements of War
      versions: 10
      latest: '2022-08026'
      latest_effective: '2022-08-24'
    - part: '478'
      title: Commerce in Firearms and Ammunition
      versions: 24
      latest: '2026-01141'
      latest_effective: '2026-01-22'
    - part: '479'
