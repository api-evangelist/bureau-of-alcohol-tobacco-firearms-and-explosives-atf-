detail: >-
  ATF publishes no client library in any language, on any registry. The
  atfweb GitHub organization holds five repositories and none of them is an SDK:
  `prudentia` (a Drupal theme built on uswds_base), `integrity` (a fork of
  uswds/uswds), and `regulations`, `regulations-core` and `django` — the server-side
