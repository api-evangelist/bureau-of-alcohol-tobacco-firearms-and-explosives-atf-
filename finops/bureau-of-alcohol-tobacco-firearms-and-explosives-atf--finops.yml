applicable: false
description: >-
  FinOps does not apply to this provider on the consumption side. ATF's public API
  surface is free, anonymous and unmetered — there is no invoice, no billed cost,
  no pricing unit and no consumer chargeback to allocate. A consumer's only real
  cost is their own egress and compute.
  THIS FILE REPLACES A FABRICATION. The 2026-05-04 bulk sweep asserted a
  "Usage-Based" pricingCategory, monthly billing in USD, an InvoiceIssuerName of
  ATF, and meters for billable api_requests, data_egress and compute_seconds. ATF
  bills nobody for API access; all of it has been removed.
billingModel:
  pricingCategory: Free
  billingFrequency: none
  billingCurrency: null
  chargeCategories: []
  chargeFrequency: none
meters: []
unitEconomics: []
consumer_side_costs:
  - name: Client egress and storage
    description: >-
      The only material cost of consuming ATF data is on the consumer's side.
      Walking the 77,514-record Federal Firearms Licensee layer takes at least 39
      paged requests at maxRecordCount 2000; the layer changes rarely (last edited
      2026-06-17), so caching rather than re-walking is the whole optimisation.
apis:
  - name: ATF eRegulations API
    baseURL: https://regulations.atf.gov/api
    cost: free
