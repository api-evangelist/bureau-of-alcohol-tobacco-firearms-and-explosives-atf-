    baseURL: https://services6.arcgis.com/PrP5ZtrES07DmVmv/arcgis/rest/services/Federal_Firearm_Licensees_locations/FeatureServer
    cost: free
  - name: ATF Office Locations (ArcGIS Feature Service)
